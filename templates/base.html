{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{% block title %}ZFX's Music Site{% endblock %}</title>
  <!-- 导入static文件的CSS样式表并生成地址 -->
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <header class="site-header">
    <h1 class="site-title">
      <a href="{% url 'catalog:song_list' %}">ZFX's Music Site</a>
    </h1>
    <nav class="site-nav">
      <a href="{% url 'catalog:song_list' %}">歌曲</a>
      <a href="{% url 'catalog:artist_list' %}">歌手</a>
      <a href="{% url 'catalog:search' %}">搜索</a>
    </nav>
  </header>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">ZFX's Music Site</footer>
</body>
</html>
