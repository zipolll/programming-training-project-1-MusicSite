<!-- 页面基础结构 -->
{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}音乐信息系统{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body>
  <header>
    <h1><a href="{% url 'catalog:song_list' %}">音乐信息系统</a></h1>
    <nav>
      <a href="{% url 'catalog:song_list' %}">歌曲</a>
      <a href="{% url 'catalog:artist_list' %}">歌手</a>
      <a href="{% url 'catalog:search' %}">搜索</a>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
